<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#061020"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ECCA3"/>
      <stop offset="100%" stop-color="#38b2ac"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window chrome -->
  <rect x="0" y="0" width="520" height="400" rx="14" fill="url(#bg)" stroke="rgba(78,204,163,0.2)" stroke-width="1" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="520" height="38" rx="14" fill="rgba(78,204,163,0.06)"/>
  <rect x="0" y="24" width="520" height="14" fill="rgba(78,204,163,0.06)"/>
  <!-- Window dots -->
  <circle cx="20" cy="19" r="5" fill="rgba(78,204,163,0.3)"/>
  <circle cx="38" cy="19" r="5" fill="rgba(78,204,163,0.2)"/>
  <circle cx="56" cy="19" r="5" fill="rgba(78,204,163,0.15)"/>
  <!-- Window title -->
  <text x="260" y="23" text-anchor="middle" fill="#64748b" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="1">KALEON · COURSES</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="80" height="362" fill="rgba(5,12,24,0.5)" stroke="rgba(78,204,163,0.08)" stroke-width="1"/>
  <!-- Sidebar logo -->
  <rect x="28" y="54" width="24" height="24" rx="5" fill="url(#teal)"/>
  <!-- Sidebar nav items -->
  <rect x="20" y="96" width="40" height="5" rx="2.5" fill="rgba(78,204,163,0.3)"/>
  <rect x="20" y="112" width="40" height="5" rx="2.5" fill="rgba(78,204,163,0.12)"/>
  <rect x="20" y="128" width="40" height="5" rx="2.5" fill="rgba(78,204,163,0.12)"/>
  <rect x="20" y="144" width="40" height="5" rx="2.5" fill="rgba(78,204,163,0.12)"/>

  <!-- Main content area -->
  <!-- Header bar -->
  <rect x="96" y="48" width="410" height="32" rx="6" fill="rgba(5,12,24,0.4)" stroke="rgba(78,204,163,0.1)" stroke-width="1"/>
  <text x="110" y="69" fill="#e2e8f0" font-size="12" font-family="sans-serif" font-weight="bold">My Courses</text>
  <rect x="420" y="55" width="72" height="18" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.3)" stroke-width="1"/>
  <text x="426" y="67" fill="#4ECCA3" font-size="8" font-family="sans-serif" font-weight="bold">+ Add Course</text>

  <!-- Course cards -->
  <!-- Course 1 -->
  <rect x="96" y="90" width="410" height="62" rx="8" fill="rgba(5,12,24,0.3)" stroke="rgba(78,204,163,0.1)" stroke-width="1"/>
  <text x="110" y="110" fill="#f1f5f9" font-size="11" font-family="sans-serif" font-weight="bold">ENGL 101 · Freshman Composition</text>
  <text x="110" y="124" fill="#64748b" font-size="9" font-family="sans-serif">Fall 2025 · 3 units</text>
  <!-- IGETC tags -->
  <rect x="110" y="132" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="116" y="142" fill="#4ECCA3" font-size="7" font-family="sans-serif">1A</text>
  <rect x="158" y="132" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="164" y="142" fill="#4ECCA3" font-size="7" font-family="sans-serif">CSU A2</text>

  <!-- Course 2 -->
  <rect x="96" y="160" width="410" height="62" rx="8" fill="rgba(5,12,24,0.3)" stroke="rgba(78,204,163,0.1)" stroke-width="1"/>
  <text x="110" y="180" fill="#f1f5f9" font-size="11" font-family="sans-serif" font-weight="bold">MATH 150 · Calculus I</text>
  <text x="110" y="194" fill="#64748b" font-size="9" font-family="sans-serif">Fall 2025 · 4 units</text>
  <rect x="110" y="202" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="116" y="212" fill="#4ECCA3" font-size="7" font-family="sans-serif">2A</text>
  <rect x="158" y="202" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="164" y="212" fill="#4ECCA3" font-size="7" font-family="sans-serif">CSU B4</text>

  <!-- Course 3 -->
  <rect x="96" y="230" width="410" height="62" rx="8" fill="rgba(5,12,24,0.3)" stroke="rgba(78,204,163,0.1)" stroke-width="1"/>
  <text x="110" y="250" fill="#f1f5f9" font-size="11" font-family="sans-serif" font-weight="bold">HIST 120 · United States History</text>
  <text x="110" y="264" fill="#64748b" font-size="9" font-family="sans-serif">Spring 2025 · 3 units</text>
  <rect x="110" y="272" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="116" y="282" fill="#4ECCA3" font-size="7" font-family="sans-serif">4</text>
  <rect x="158" y="272" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="164" y="282" fill="#4ECCA3" font-size="7" font-family="sans-serif">CSU D</text>

  <!-- Course 4 -->
  <rect x="96" y="300" width="410" height="62" rx="8" fill="rgba(5,12,24,0.3)" stroke="rgba(78,204,163,0.1)" stroke-width="1"/>
  <text x="110" y="320" fill="#f1f5f9" font-size="11" font-family="sans-serif" font-weight="bold">BIOL 105 · Cell Biology</text>
  <text x="110" y="334" fill="#64748b" font-size="9" font-family="sans-serif">Spring 2025 · 4 units</text>
  <rect x="110" y="342" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="116" y="352" fill="#4ECCA3" font-size="7" font-family="sans-serif">5B</text>
  <rect x="158" y="342" width="44" height="14" rx="4" fill="rgba(78,204,163,0.12)" stroke="rgba(78,204,163,0.25)" stroke-width="0.5"/>
  <text x="164" y="352" fill="#4ECCA3" font-size="7" font-family="sans-serif">CSU B2</text>

  <!-- Footer CTA bar -->
  <rect x="96" y="376" width="410" height="24" rx="6" fill="rgba(78,204,163,0.08)" stroke="rgba(78,204,163,0.12)" stroke-width="1"/>
  <text x="301" y="393" text-anchor="middle" fill="#4ECCA3" font-size="10" font-family="monospace" font-weight="bold" letter-spacing="1">AI PATHWAYS · PROGRESS · SCHOLARSHIPS</text>
</svg>

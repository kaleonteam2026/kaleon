openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pathwise CC API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profiles
    description: Student profile operations
  - name: courses
    description: Course management
  - name: matches
    description: University matching
  - name: pathways
    description: AI pathway generation
  - name: guidebooks
    description: Guidebook generation
  - name: opportunities
    description: Scholarships and opportunities

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"
        "401":
          description: Not authenticated

  /profiles:
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Create student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileBody"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Unauthorized

  /profiles/user/{userId}:
    get:
      operationId: getProfilesByUser
      tags: [profiles]
      summary: Get profiles for user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Unauthorized

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Not found
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
    delete:
      operationId: deleteProfile
      tags: [profiles]
      summary: Delete profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /profiles/{profileId}/courses:
    get:
      operationId: getCourses
      tags: [courses]
      summary: List courses for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: addCourse
      tags: [courses]
      summary: Add course to profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "201":
          description: Course added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{courseId}:
    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseBody"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /profiles/{profileId}/gpa-summary:
    get:
      operationId: getGpaSummary
      tags: [courses]
      summary: Get GPA summary for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: GPA summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpaSummary"

  /profiles/{profileId}/generate-matches:
    post:
      operationId: generateMatches
      tags: [matches]
      summary: Score universities for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ranked university matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniversityMatch"

  /profiles/{profileId}/matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Get cached matches for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cached university matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniversityMatch"

  /profiles/{profileId}/generate-pathways:
    post:
      operationId: generatePathways
      tags: [pathways]
      summary: Generate AI pathway reports
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Three pathway reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pathway"
        "429":
          description: Rate limit exceeded

  /profiles/{profileId}/pathways:
    get:
      operationId: getPathways
      tags: [pathways]
      summary: Get pathways for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of pathways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pathway"

  /pathways/{pathwayId}:
    get:
      operationId: getPathway
      tags: [pathways]
      summary: Get single pathway
      parameters:
        - name: pathwayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pathway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pathway"

  /pathways/{pathwayId}/select:
    post:
      operationId: selectPathway
      tags: [pathways]
      summary: Mark pathway as selected
      parameters:
        - name: pathwayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated pathway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pathway"

  /pathways/{pathwayId}/generate-guidebook:
    post:
      operationId: generateGuidebook
      tags: [guidebooks]
      summary: Generate AI guidebook for pathway
      parameters:
        - name: pathwayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated guidebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guidebook"
        "429":
          description: Rate limit exceeded

  /guidebooks/{guidebookId}:
    get:
      operationId: getGuidebook
      tags: [guidebooks]
      summary: Get guidebook
      parameters:
        - name: guidebookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Guidebook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guidebook"
    delete:
      operationId: deleteGuidebook
      tags: [guidebooks]
      summary: Delete guidebook
      parameters:
        - name: guidebookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /profiles/{profileId}/guidebooks:
    get:
      operationId: getGuidebooks
      tags: [guidebooks]
      summary: List guidebooks for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of guidebooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guidebook"

  /scholarships:
    get:
      operationId: getScholarships
      tags: [opportunities]
      summary: Get all scholarships
      responses:
        "200":
          description: All scholarships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scholarship"

  /opportunities:
    get:
      operationId: getOpportunities
      tags: [opportunities]
      summary: Get all opportunities
      responses:
        "200":
          description: All opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"

  /profiles/{profileId}/recommended-scholarships:
    post:
      operationId: getRecommendedScholarships
      tags: [opportunities]
      summary: Get filtered scholarship recommendations
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommended scholarships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scholarship"

  /profiles/{profileId}/recommended-opportunities:
    post:
      operationId: getRecommendedOpportunities
      tags: [opportunities]
      summary: Get filtered opportunity recommendations
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommended opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"

  /dashboard-summary/{profileId}:
    get:
      operationId: getDashboardSummary
      tags: [profiles]
      summary: Get dashboard summary for profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    GetCurrentAuthUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
      required: [id]

    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        fullName:
          type: string
          nullable: true
        communityCollege:
          type: string
          nullable: true
        currentGpa:
          type: number
          nullable: true
        intendedMajor:
          type: string
          nullable: true
        careerGoal:
          type: string
          nullable: true
        financialSituation:
          type: string
          nullable: true
        transferTimeline:
          type: string
          nullable: true
        geographicPreference:
          type: string
          nullable: true
        targetUniversities:
          type: array
          items:
            type: string
          nullable: true
        longTermAspirations:
          type: string
          nullable: true
        isFirstGen:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
          nullable: true
        completionPercent:
          type: number
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, userId]

    CreateProfileBody:
      type: object
      properties:
        fullName:
          type: string
        communityCollege:
          type: string
        currentGpa:
          type: number
        intendedMajor:
          type: string
        careerGoal:
          type: string
        financialSituation:
          type: string
        transferTimeline:
          type: string
        geographicPreference:
          type: string
        targetUniversities:
          type: array
          items:
            type: string
        longTermAspirations:
          type: string
        isFirstGen:
          type: string
        interests:
          type: array
          items:
            type: string

    UpdateProfileBody:
      type: object
      properties:
        fullName:
          type: string
        communityCollege:
          type: string
        currentGpa:
          type: number
        intendedMajor:
          type: string
        careerGoal:
          type: string
        financialSituation:
          type: string
        transferTimeline:
          type: string
        geographicPreference:
          type: string
        targetUniversities:
          type: array
          items:
            type: string
        longTermAspirations:
          type: string
        isFirstGen:
          type: string
        interests:
          type: array
          items:
            type: string
        completionPercent:
          type: number

    Course:
      type: object
      properties:
        id:
          type: integer
        profileId:
          type: integer
        courseCode:
          type: string
          nullable: true
        courseName:
          type: string
        units:
          type: number
          nullable: true
        grade:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, profileId, courseName]

    CreateCourseBody:
      type: object
      properties:
        courseCode:
          type: string
        courseName:
          type: string
        units:
          type: number
        grade:
          type: string
        status:
          type: string
        term:
          type: string
      required: [courseName]

    UpdateCourseBody:
      type: object
      properties:
        courseCode:
          type: string
        courseName:
          type: string
        units:
          type: number
        grade:
          type: string
        status:
          type: string
        term:
          type: string

    GpaSummary:
      type: object
      properties:
        estimatedGpa:
          type: number
        totalUnits:
          type: number
        completedUnits:
          type: number
        inProgressUnits:
          type: number
        courseCount:
          type: integer
      required: [estimatedGpa, totalUnits, completedUnits, inProgressUnits, courseCount]

    UniversityMatch:
      type: object
      properties:
        universityId:
          type: string
        name:
          type: string
        system:
          type: string
        location:
          type: string
        compatibilityScore:
          type: integer
        fitLabel:
          type: string
        fitColor:
          type: string
        gpaRangeMin:
          type: number
        gpaRangeRecommended:
          type: number
        costCategory:
          type: string
        transferFriendliness:
          type: integer
        officialTransferUrl:
          type: string
        notes:
          type: string
        breakdown:
          $ref: "#/components/schemas/ScoreBreakdown"
        majors:
          type: array
          items:
            type: string
        careerTags:
          type: array
          items:
            type: string
      required: [universityId, name, compatibilityScore, fitLabel]

    ScoreBreakdown:
      type: object
      properties:
        majorAlignment:
          type: number
        gpaFit:
          type: number
        coursework:
          type: number
        costFit:
          type: number
        locationFit:
          type: number
        careerFit:
          type: number
        experienceAccess:
          type: number
        timeFit:
          type: number
        supportFit:
          type: number
      required: [majorAlignment, gpaFit, costFit, locationFit, careerFit]

    Pathway:
      type: object
      properties:
        id:
          type: integer
        profileId:
          type: integer
        universityId:
          type: string
          nullable: true
        compatibilityScore:
          type: number
          nullable: true
        pathwayType:
          type: string
          nullable: true
        reportJson:
          $ref: "#/components/schemas/PathwayReport"
        isSelected:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, profileId]

    PathwayReport:
      type: object
      properties:
        type:
          type: string
        university:
          type: string
        compatibilityScore:
          type: number
        whyItFits:
          type: string
        concerns:
          type: string
        gpaTarget:
          type: number
        courseGaps:
          type: array
          items:
            type: string
        transferTimeline:
          type: string
        scholarshipOptions:
          type: array
          items:
            type: string
        internshipRecommendations:
          type: array
          items:
            type: string
        extracurricularRecommendations:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        nextSteps:
          type: array
          items:
            type: string
      required: [type, university, compatibilityScore]

    Guidebook:
      type: object
      properties:
        id:
          type: integer
        pathwayId:
          type: integer
        profileId:
          type: integer
        contentMarkdown:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, pathwayId, profileId]

    Scholarship:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: string
        deadline:
          type: string
        minGpa:
          type: number
          nullable: true
        eligibilityTags:
          type: array
          items:
            type: string
        description:
          type: string
        sourceUrl:
          type: string
        sourceDate:
          type: string
        isEstimate:
          type: boolean
      required: [id, name, amount]

    Opportunity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        eligibilityTags:
          type: array
          items:
            type: string
        applicationUrl:
          type: string
        sourceDate:
          type: string
        isEstimate:
          type: boolean
      required: [id, name, type]

    DashboardSummary:
      type: object
      properties:
        profileCompletionPercent:
          type: number
        totalCourses:
          type: integer
        completedCourses:
          type: integer
        inProgressCourses:
          type: integer
        estimatedGpa:
          type: number
          nullable: true
        savedPathwaysCount:
          type: integer
        guidebooksCount:
          type: integer
        topMatchUniversity:
          type: string
          nullable: true
        topMatchScore:
          type: integer
          nullable: true
        nextActions:
          type: array
          items:
            type: string
      required: [profileCompletionPercent, totalCourses, completedCourses, inProgressCourses, savedPathwaysCount, guidebooksCount, nextActions]

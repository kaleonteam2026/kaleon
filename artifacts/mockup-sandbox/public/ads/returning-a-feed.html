<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYP Ad - Returning A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #0F172A;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
  }
  * {
    box-sizing: border-box;
  }
  .ad {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6vh 7vw;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .sans { font-family: 'Inter', sans-serif; }
  
  .logo-lockup {
    display: flex;
    align-items: center;
    gap: 2vw;
  }
  .logo-box {
    width: 7vh;
    height: 7vh;
    background-color: #0F172A;
    border: 3px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 4vh;
    line-height: 1;
  }
  .logo-text {
    display: flex;
    flex-direction: column;
  }
  .logo-dyp {
    font-size: 4vh;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.05em;
  }
  .logo-sub {
    font-size: 1.5vh;
    color: #CBD5E1;
    margin-top: 0.5vh;
  }

  .middle {
    display: flex;
    flex-direction: column;
    gap: 3vh;
  }
  .headline {
    font-size: 7.5vw;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin: 0;
    white-space: pre-wrap;
  }
  .benefit {
    font-size: 3vw;
    font-weight: 700;
    color: #CBD5E1;
    margin: 0;
    line-height: 1.3;
    max-width: 85vw;
  }

  .cta-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5vh;
  }
  .cta-btn {
    background-color: #0F172A;
    color: #FFFFFF;
    font-size: 3.5vw;
    font-weight: 800;
    padding: 2.4vh 4vw;
    border: 3px solid #FFFFFF;
    box-shadow: 5px 5px 0 0 #FFFFFF;
    text-transform: uppercase;
  }
  .cta-sub {
    font-size: 1.4vw;
    color: #CBD5E1;
  }

  .footer {
    font-size: 1.8vw;
    color: #CBD5E1;
  }

  @media (max-aspect-ratio: 0.7) {
    .ad { padding: 8vh 7vw; }
    .headline { font-size: 10vw; }
  }
</style>
</head>
<body>
  <div class="ad">
    <div class="logo-lockup">
      <div class="logo-box mono">D</div>
      <div class="logo-text sans">
        <div class="logo-dyp">DYP</div>
        <div class="logo-sub mono">// DO YOUR PATH</div>
      </div>
    </div>

    <div class="middle">
      <h1 class="headline mono">GOING BACK AT 30?<br>GO BACK SMART.</h1>
      <p class="benefit sans">DYP plans your transfer around shifts, kids, and CC night classes. AI does the spreadsheet, you do the path.</p>
    </div>

    <div class="cta-wrap">
      <div class="cta-btn sans">GET STARTED FREE &rarr;</div>
    </div>

    <div class="footer mono">// FREE &middot; NO CREDIT CARD &middot; DOYOURPATH.APP</div>
  </div>
</body>
</html>

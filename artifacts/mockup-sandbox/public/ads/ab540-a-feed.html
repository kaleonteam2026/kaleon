<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathwise CC Ad - AB540</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --slate-900: #0F172A;
      --off-white: #F4F4F5;
      --white: #FFFFFF;
      --amber: #FEF3C7;
      --amber-text: #78350F;
      --benefit-color: #CBD5E1;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--slate-900);
      color: var(--white);
    }
    
    .ad {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6vh 7vw;
      box-sizing: border-box;
      background-color: var(--slate-900);
    }
    
    /* Logo Lockup */
    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 2vw;
    }
    
    .logo-square {
      width: 7vh;
      height: 7vh;
      background-color: var(--slate-900);
      border: 3px solid var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: var(--white);
      font-size: 4vh;
      line-height: 1;
    }
    
    .logo-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .logo-wordmark {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 3.5vh;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    
    .logo-tag {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.2vh;
      color: var(--benefit-color);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.5vh;
    }
    
    /* Middle Section */
    .content {
      display: flex;
      flex-direction: column;
      gap: 3vh;
    }
    
    .headline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 7vw;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      margin: 0;
    }
    
    .benefit {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 3vw;
      color: var(--benefit-color);
      line-height: 1.3;
      margin: 0;
    }
    
    /* CTA Section */
    .cta-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5vh;
    }
    
    .cta-button {
      background-color: var(--slate-900);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 3.5vw;
      padding: 2.4vh 4vw;
      border: 3px solid var(--white);
      box-shadow: 5px 5px 0 0 var(--white);
      text-transform: uppercase;
      display: inline-block;
      margin: 0;
    }
    
    .cta-subtext {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.4vw;
      text-transform: uppercase;
      color: var(--benefit-color);
      margin: 0;
    }
    
    /* Footer */
    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.8vw;
      color: var(--benefit-color);
      text-transform: uppercase;
    }
    
    @media (max-aspect-ratio: 0.7) {
      .headline {
        font-size: 10vw;
      }
      .logo-lockup {
        margin-top: 2vh;
      }
      .footer {
        margin-bottom: 2vh;
      }
    }
  </style>
</head>
<body>
  <div class="ad">
    <!-- 1. Logo Lockup -->
    <div class="logo-lockup">
      <div class="logo-square">D</div>
      <div class="logo-text">
        <div class="logo-wordmark">DYP</div>
        <div class="logo-tag">// DO YOUR PATH</div>
      </div>
    </div>
    
    <!-- 2. Middle Content -->
    <div class="content">
      <h1 class="headline">AB540 TRANSFER.<br>MAPPED.</h1>
      <p class="benefit">Every AB540-eligible program, Cal Grant / Dream Act scholarship, and UC pathway &mdash; planned for you. Free.</p>
    </div>
    
    <!-- 3. CTA -->
    <div class="cta-wrapper">
      <div class="cta-button">GET STARTED FREE &rarr;</div>
      <div class="cta-subtext">// FREE &middot; NO CREDIT CARD</div>
    </div>
    
    <!-- 4. Footer -->
    <div class="footer">
      DYP // DOYOURPATH.APP
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathwise CC Ad - First Gen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0F172A;
      color: #FFFFFF;
    }
    .ad-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6vh 7vw;
      box-sizing: border-box;
    }
    
    /* Logo */
    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 2vw;
    }
    .logo-square {
      width: 7vh;
      height: 7vh;
      background-color: #000000;
      border: 3px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 4vh;
      box-sizing: border-box;
    }
    .logo-text-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .logo-wordmark {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 4.5vh;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.05em;
    }
    .logo-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5vh;
      color: #64748B;
      text-transform: uppercase;
      margin-top: 0.5vh;
    }

    /* Content */
    .content-block {
      display: flex;
      flex-direction: column;
      gap: 3vh;
    }
    .headline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 8vw;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .benefit {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 3vw;
      color: #CBD5E1;
      line-height: 1.3;
      margin: 0;
      max-width: 85vw;
    }

    /* CTA */
    .cta-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5vh;
    }
    .cta-btn {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 3.5vw;
      padding: 2.4vh 4vw;
      border: 3px solid #FFFFFF;
      box-shadow: 5px 5px 0 0 #FFFFFF;
      text-transform: uppercase;
    }
    .cta-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4vw;
      text-transform: uppercase;
      color: #CBD5E1;
      margin-left: 0.5vw;
    }

    /* Footer */
    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8vw;
      color: #64748B;
      text-transform: uppercase;
    }

    @media (aspect-ratio < 0.7) {
      .headline {
        font-size: 10vw;
      }
      .logo-lockup {
        transform: translateY(2vh);
      }
      .footer {
        transform: translateY(-2vh);
      }
      .cta-btn {
        font-size: 4.5vw;
        padding: 2vh 5vw;
      }
      .cta-sub {
        font-size: 2vw;
      }
      .benefit {
        font-size: 3.5vw;
      }
      .footer {
        font-size: 2.5vw;
      }
    }
  </style>
</head>
<body>
  <div class="ad-container">
    <div class="logo-lockup">
      <div class="logo-square">D</div>
      <div class="logo-text-block">
        <div class="logo-wordmark">DYP</div>
        <div class="logo-tagline">// DO YOUR PATH</div>
      </div>
    </div>
    
    <div class="content-block">
      <h1 class="headline">FIRST IN YOUR FAMILY?&nbsp;&nbsp;SAME.</h1>
      <p class="benefit">DYP walks first-gen CC students through transfer to UC, CSU, and private. Free, AI-powered, in your pocket.</p>
    </div>

    <div class="cta-wrapper">
      <div class="cta-btn">GET STARTED FREE &rarr;</div>
      <div class="cta-sub">// FREE &middot; NO CREDIT CARD</div>
    </div>

    <div class="footer">
      // FREE · NO CREDIT CARD · DOYOURPATH.APP
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathwise CC Ad - AB540 B Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --slate-900: #0F172A;
      --slate-700: #334155;
      --slate-500: #64748B;
      --amber-900: #78350F;
      --white: #FFFFFF;
      --amber-bg: #FEF3C7;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--amber-bg);
    }

    .ad {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6vh 7vw;
      box-sizing: border-box;
      background-color: var(--amber-bg);
      color: var(--slate-900);
    }

    /* 1. Top-left logo lockup */
    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 2vw;
    }
    
    .logo-square {
      width: 7vh;
      height: 7vh;
      background-color: var(--slate-900);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 4vh;
      border: 3px solid var(--slate-900);
      box-shadow: 6px 6px 0 0 var(--slate-900);
    }

    .logo-text-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .wordmark {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 3.5vh;
      line-height: 1;
      text-transform: uppercase;
      color: var(--slate-900);
      letter-spacing: -0.02em;
    }

    .logo-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5vh;
      color: var(--slate-500);
      margin-top: 0.5vh;
      white-space: nowrap;
    }

    /* 2. Middle headline+benefit */
    .middle-content {
      display: flex;
      flex-direction: column;
      gap: 3vh;
    }

    .headline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 8vw;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--slate-900);
      margin: 0;
      padding: 0;
    }

    .benefit {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 3vw;
      line-height: 1.3;
      color: var(--amber-900);
      max-width: 85vw;
      margin: 0;
      padding: 0;
    }

    /* 3. CTA Button */
    .cta-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5vh;
    }

    .cta-button {
      background-color: var(--slate-900);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 4vw;
      padding: 2.4vh 4vw;
      border: 3px solid var(--white);
      box-shadow: 5px 5px 0 0 var(--slate-900);
      text-transform: uppercase;
      white-space: nowrap;
      display: inline-block;
      text-decoration: none;
    }

    .cta-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4vw;
      color: var(--slate-900);
      text-transform: uppercase;
      font-weight: 800;
    }

    /* 4. Footer line */
    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.4vw;
      color: var(--slate-900);
      text-transform: uppercase;
      align-self: flex-start;
    }

    /* Story Aspect Ratio Adjustments */
    @media (aspect-ratio < 0.7) {
      .headline {
        font-size: 10vw;
      }
      .benefit {
        font-size: 4vw;
      }
      .cta-button {
        font-size: 5vw;
        padding: 2vh 5vw;
      }
      .cta-tag {
        font-size: 2vw;
      }
      .footer {
        font-size: 2vw;
      }
      .logo-lockup {
        margin-top: 2vh;
      }
      .footer {
        margin-bottom: 2vh;
      }
    }
  </style>
</head>
<body>
  <div class="ad">
    <!-- 1. Top-left logo lockup -->
    <div class="logo-lockup">
      <div class="logo-square">D</div>
      <div class="logo-text-wrapper">
        <div class="wordmark">DYP</div>
        <div class="logo-tag">// DO YOUR PATH</div>
      </div>
    </div>

    <!-- 2. Middle Headline & Benefit -->
    <div class="middle-content">
      <h1 class="headline">AB540.<br>DREAM ACT.<br>CAL GRANT.<br>SORTED.</h1>
      <p class="benefit">40+ scholarships filtered for AB540 students. Real eligibility. Real deadlines. No paywall.</p>
    </div>

    <!-- 3. CTA Button -->
    <div class="cta-container">
      <div class="cta-button">GET STARTED FREE &rarr;</div>
      <div class="cta-tag">// FREE &middot; NO CREDIT CARD</div>
    </div>

    <!-- 4. Footer line -->
    <div class="footer">
      // FREE &middot; NO CREDIT CARD &middot; DOYOURPATH.APP
    </div>
  </div>
</body>
</html>

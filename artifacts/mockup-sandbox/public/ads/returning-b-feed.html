<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathwise CC Ad - Returning B Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #F4F4F5;
    }
    
    .ad { 
      width: 100vw; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      padding: 6vh 7vw; 
      box-sizing: border-box; 
    }
    
    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 2vw;
    }
    
    .logo-square {
      width: 7vh;
      height: 7vh;
      background-color: #0F172A;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 4vh;
      border: 3px solid #0F172A;
      box-sizing: border-box;
      border-radius: 0;
      box-shadow: 6px 6px 0 0 #0F172A;
    }
    
    .logo-text-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .logo-dyp {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 5vh;
      color: #0F172A;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 0.5vh;
    }
    
    .logo-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5vh;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    
    .middle-content {
      display: flex;
      flex-direction: column;
      gap: 3vh;
    }
    
    .headline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 9vw;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      color: #0F172A;
      margin: 0;
    }
    
    .benefit {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 3vw;
      line-height: 1.3;
      color: #475569;
      margin: 0;
      max-width: 80vw;
    }
    
    .cta-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5vh;
    }
    
    .cta-button {
      background-color: #0F172A;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 4vw;
      padding: 2.4vh 4vw;
      border: 3px solid #FFFFFF;
      box-shadow: 5px 5px 0 0 #0F172A;
      text-transform: uppercase;
      border-radius: 0;
      text-decoration: none;
    }
    
    .cta-subtext {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4vw;
      color: #0F172A;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4vw;
      color: #0F172A;
      text-transform: uppercase;
      font-weight: 800;
    }

    @media (max-aspect-ratio: 0.7) {
      .ad {
        padding: 8vh 7vw;
      }
      .headline {
        font-size: 10vw;
      }
      .benefit {
        font-size: 3.5vw;
      }
      .cta-button {
        font-size: 5vw;
      }
      .cta-subtext {
        font-size: 1.8vw;
      }
      .footer {
        font-size: 2vw;
      }
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="logo-lockup">
      <div class="logo-square">D</div>
      <div class="logo-text-group">
        <div class="logo-dyp">DYP</div>
        <div class="logo-tagline">// DO YOUR PATH</div>
      </div>
    </div>

    <div class="middle-content">
      <h1 class="headline">WORKING PARENT.<br>TRANSFER STUDENT.<br>BOTH.</h1>
      <p class="benefit">Track GPA, certifications, and 40+ adult-friendly scholarships. From CC to a 4-year — on your schedule.</p>
    </div>

    <div class="cta-wrapper">
      <div class="cta-button">GET STARTED FREE &rarr;</div>
      <div class="cta-subtext">// FREE &middot; NO CREDIT CARD</div>
    </div>

    <div class="footer">
      // FREE &middot; NO CREDIT CARD &middot; DOYOURPATH.APP
    </div>
  </div>
</body>
</html>

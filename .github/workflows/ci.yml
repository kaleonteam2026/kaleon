name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  OIDC_CLIENT_ID: ci-test-client
  OIDC_ISSUER_URL: https://example.com
  PUBLIC_ORIGIN: http://localhost:19245
  ALLOWED_ORIGINS: http://localhost:19245,http://localhost:8080
  PRIVATE_OBJECT_DIR: /ci-bucket/private
  DATABASE_URL: postgresql://localhost:5432/pathwise_ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build web
        run: pnpm --filter @workspace/pathwise-cc run build

      - name: API unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: Smoke (build artifacts)
        run: ./scripts/smoke.sh

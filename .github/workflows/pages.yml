# Deploy Pathwise CC static UI to the gh-pages branch.
#
# GitHub Pages is currently rendering README.md because the site uses
# "Deploy from a branch" → main → / (Jekyll). After this workflow runs,
# change Settings → Pages → Branch: gh-pages → / (root).
#
# Site URL: https://kaleonteam2026.github.io/kaleon/

name: Deploy GitHub Pages

on:
  push:
    branches: [main, feat/replit-decoupling]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (static demo)
        env:
          BASE_PATH: /kaleon/
          PORT: "19245"
          VITE_AUTH_BYPASS: "true"
        run: pnpm --filter @workspace/pathwise-cc run build

      - name: SPA fallback for client-side routes
        run: cp artifacts/pathwise-cc/dist/public/index.html artifacts/pathwise-cc/dist/public/404.html

      - run: touch artifacts/pathwise-cc/dist/public/.nojekyll

      - name: Publish built app to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/pathwise-cc/dist/public
          publish_branch: gh-pages
